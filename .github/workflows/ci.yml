# Checks every pull request, and every push to development, before it can go live.
# Fails if a content file is missing a required field, points at an image that
# doesn't exist, has an oversized file, or the site has broken links.
name: CI

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build site and check links
        run: npm run check
