# Builds and publishes the website.
#
#   main         →  https://strike-vs-guard.github.io/Strike-Versus-Guard/          (live site)
#   development  →  https://strike-vs-guard.github.io/Strike-Versus-Guard/preview/  (test site)
#
# Every run builds BOTH branches and publishes them together, so the repository
# only needs these two branches. It runs:
#   - on a push to main, and
#   - after the CI check passes on development. That run happens on main's side,
#     because GitHub only lets the default branch publish to Pages.
#
# Requires: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After CI on development, only publish if the check passed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      REPO_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Check out main (live site)
        uses: actions/checkout@v5
        with:
          ref: main
          path: live

      - name: Check out development (test site)
        id: dev
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: development
          path: preview

      - uses: actions/setup-node@v5
        with:
          node-version-file: live/.nvmrc

      - name: Build live site from main
        working-directory: live
        env:
          BASE_PATH: ${{ env.REPO_PATH }}
        run: |
          npm ci
          npm run check

      - name: Build test site from development
        if: steps.dev.outcome == 'success'
        working-directory: preview
        env:
          BASE_PATH: ${{ env.REPO_PATH }}preview/
          PREVIEW: '1'
        run: |
          npm ci
          npm run check

      - name: Combine
        run: |
          mkdir -p _site
          cp -r live/dist/. _site/
          if [ -d preview/dist ]; then mkdir -p _site/preview && cp -r preview/dist/. _site/preview/; fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
